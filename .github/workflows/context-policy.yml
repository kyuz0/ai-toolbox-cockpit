name: Context override policy
on: [push, pull_request]
jobs:
  context-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q tests/test_context_policy.py tests/test_radiance_commands.py
